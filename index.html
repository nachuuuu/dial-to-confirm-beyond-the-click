<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dial to Confirm</title>
<style>
/* 1. PAGE */ *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#ba5148,#963932 60%,#712520);color:#f0dfbd;font:12px ui-monospace,monospace}main{width:min(100%,680px);min-height:100vh;margin:auto;padding:27px 20px;display:grid;place-items:center;text-align:center}
/* 2. TEXT */ header{width:100%;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:#ffdbae}h1{margin:14px 0 5px;font:700 clamp(28px,5vw,44px) Georgia,serif}.code{margin:12px auto 6px;padding:10px 14px 8px;width:max-content;background:#201514;color:#ffe8b9;font-size:22px;letter-spacing:.4em;box-shadow:3px 3px #5a201e}.hint{height:17px;color:#ffe0a2;font-size:10px}
/* 3. WALL PHONE */ .phone{position:relative;width:min(88vw,420px);aspect-ratio:1.04;filter:drop-shadow(0 16px 13px #2d0a0a80)}.base{position:absolute;z-index:1;top:7%;right:8%;bottom:5%;left:24%;border-radius:16px;background:linear-gradient(145deg,#e9d4ae,#a78f69);box-shadow:inset 5px 5px 8px #fff0ca,inset -7px -8px 9px #756149,0 9px #682a27}.receiver{position:absolute;z-index:5;top:7%;left:3%;width:28%;height:84%;border:3px solid #151515;border-radius:32px;background:linear-gradient(90deg,#4a514e,#151a19 46%,#434946);box-shadow:inset 5px 0 6px #727b75,inset -5px 0 7px #090b0b,5px 7px 5px #51211f}.receiver:before,.receiver:after{content:"";position:absolute;left:-10%;right:-10%;height:17%;border:2px solid #151515;border-radius:25px;background:linear-gradient(#626a63,#1b1e1d 60%,#080a0a)}.receiver:before{top:-1%}.receiver:after{bottom:-1%}
/* 4. DISPLAY + KEYPAD */ .screen{position:absolute;z-index:3;top:15%;left:40%;width:42%;height:13%;display:grid;place-items:center;border:4px solid #76634a;border-radius:4px;background:#050807;color:#a8eea8;font-size:clamp(11px,3vw,16px);letter-spacing:.2em;text-shadow:0 0 8px #62d874}.screen small{font-size:7px;letter-spacing:.12em;color:#789b78}.keys{position:absolute;z-index:3;top:33%;left:39%;width:45%;height:53%;padding:6%;display:grid;grid-template-columns:repeat(3,1fr);gap:7%;border-radius:7px;background:linear-gradient(145deg,#675b49,#3d342a);box-shadow:inset 3px 3px #95846a}.key{border:0;border-radius:3px;background:linear-gradient(145deg,#454b49,#141918);color:#f8e6bd;font:700 clamp(14px,4vw,20px) ui-monospace,monospace;cursor:pointer;box-shadow:inset 2px 2px #78807c,inset -2px -2px #080a0a,0 2px #272019}.key:active{transform:translateY(2px)}.zero{grid-column:2}.key span{display:block;font-size:6px;font-weight:400}
/* 5. CONTROLS + RESULT */ .red,.reset{cursor:pointer}.red{position:absolute;z-index:4;top:74%;left:85%;width:8%;aspect-ratio:1;border:2px solid #6e1616;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff7661,#bd2b27 55%,#6b120f)}.panel{width:min(100%,410px);padding:11px 15px 9px;border:1px solid #b89d75;border-radius:4px;background:#f0dfbd;color:#3b2b20;box-shadow:0 3px #6a2925}.panel div:first-child{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.15em}.entry{min-height:27px;padding-top:5px;text-align:left;font-size:19px;letter-spacing:.3em}.state{font-size:9px;letter-spacing:.08em}.ok{color:#28733a;font-weight:700}.reset{padding:10px 15px 8px;border:1px solid #f1c58a;border-radius:3px;background:#551d1b;color:#ffe1ae;font:10px ui-monospace,monospace;letter-spacing:.1em}.lamp{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#4d2421}.on{background:#7fce73;box-shadow:0 0 10px #96e484}
</style></head>
<body><main>
<!-- 6. HEADER --><header><span>BEYOND THE CLICK / 01</span><span><i class="lamp" id="lamp"></i><b id="line">LINE OPEN</b></span></header>
<!-- 7. INSTRUCTION --><section><h1>Dial to confirm.</h1><p>Enter the number shown to make your selection.</p><div class="code" id="code"></div><div class="hint" id="hint">PRESS THE KEYS TO DIAL THE NUMBER</div></section>
<!-- 8. PHONE --><section class="phone"><i class="base"></i><i class="receiver"></i><div class="screen" id="screen"><small>LINE READY</small></div><div class="keys" id="keys"></div><button class="red" id="hang" aria-label="Reset"></button></section>
<!-- 9. CONFIRMATION --><section class="panel"><div><span>NUMBERS DIALED</span><span id="count">0 / 4</span></div><div class="entry" id="entry">—</div><div class="state" id="state">○ UNCHECKED — AWAITING CONFIRMATION</div></section><button class="reset" id="reset">↯ HANG UP / RESET</button><input id="check" type="checkbox" hidden>
</main>
<script>
// 10. REFERENCES
const $=s=>document.querySelector(s),keys=$('#keys');let code='',entry='',audio;
// 11. SOUND
const tone=(f,d=.04,t=0)=>{audio??=new AudioContext;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.025,audio.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+t+d);o.connect(g).connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+d)};
// 12. DISPLAY HELPERS
const show=()=>{$('#entry').textContent=entry?entry.split('').join(' '):'—';$('#count').textContent=`${entry.length} / 4`},newCode=()=>{code=''+Math.floor(1000+Math.random()*9000);$('#code').textContent=code;$('#screen').innerHTML='<small>LINE READY</small>'};
// 13. RESET FUNCTION
const reset=()=>{entry='';$('#check').checked=false;newCode();show();$('#hint').textContent='PRESS THE KEYS TO DIAL THE NUMBER';$('#state').textContent='○ UNCHECKED — AWAITING CONFIRMATION';$('#state').className='state';$('#lamp').className='lamp';$('#line').textContent='LINE OPEN'};
// 14. VALIDATE NUMBER
const validate=()=>{if(entry===code){$('#check').checked=true;$('#screen').innerHTML='<small>CONFIRMED</small>';$('#state').textContent='✓ CHECKED — SELECTION CONFIRMED';$('#state').className='state ok';$('#hint').textContent='YOUR SELECTION IS CONNECTED';$('#lamp').className='lamp on';$('#line').textContent='LINE CONNECTED';tone(440,.25);tone(480,.25,.05)}else{$('#screen').innerHTML='<small>TRY AGAIN</small>';$('#hint').textContent='WRONG NUMBER. PLEASE TRY AGAIN.';setTimeout(()=>{entry='';show();$('#screen').innerHTML='<small>LINE READY</small>';$('#hint').textContent='PRESS THE KEYS TO DIAL THE NUMBER'},1100)}};
// 15. DIAL A KEY
const dial=n=>{if($('#check').checked||entry.length===4)return;audio?.resume();tone(485);tone(860,.018,.028);entry+=n;show();$('#screen').textContent=entry.padEnd(4,'_');$('#hint').textContent=`${n} DIALED — ${entry.length<4?'NEXT NUMBER…':'CHECKING…'}`;if(entry.length===4)setTimeout(validate,350)};
// 16. BUILD KEYPAD
[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['0','']].forEach(([n,l])=>{let b=document.createElement('button');b.className='key '+(n==='0'?'zero':'');b.innerHTML=n+(l?`<span>${l}</span>`:'');b.onclick=()=>dial(n);keys.append(b)});
// 17. START APP
$('#reset').onclick=$('#hang').onclick=reset;reset();
</script></body></html>
